<template>
  <div>
    <lightning-input
      class={className}
      name={textName}
      type={type}
      label={textLabel}
      placeholder={_textPlaceholder}
      pattern={pattern}
      min-length={minLength}
      max-length={maxLength}
      date-style="short"
      variant={variant}
      message-when-pattern-mismatch={_messageWhenPatternMismatch}
      message-when-too-long={_messageWhenTooLong}
      message-when-too-short={_messageWhenTooShort}
      message-when-value-missing={_messageWhenValueMissing}
      message-when-type-mismatch={_messageWhenTypeMismatch}
      message-when-range-underflow={_messageWhenRangeLow}
      message-when-range-overflow={_messageWhenRangeHigh}
      value={_defaultValue}
      required={isRequiredCheck}
      disabled={_isDisabled}
      readonly={isReadOnly}
      data-value={_defaultValue}
      data-name={parentName}
      onchange={handleChange}
      onblur={handleBlur}
      onkeyup={handleKeyup}
      onfocus={handleFocus}
      min={minValue}
      max={maxValue}
      onkeypress={handleKeyPress}
    ></lightning-input>
  </div>

  <!-- Error messages Markup -->
  <template if:true={_errorMsgs}>
    <template for:each={_errorMsgs} for:item="message">
      <div key={message} class={errorClassName}>
        <div class="slds-form-element__help slds-m-top_small">{message}</div>
      </div>
    </template>
  </template>
</template>
