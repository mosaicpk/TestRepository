<template>
  <div class="slds-form-element combobox-container">
    <label class="slds-form-element__label" for="combobox-id-58">
      <abbr class="slds-required" title="required">*</abbr>
      {label}
    </label>
    <div class="slds-form-element__control">
      <div class={containerClasswithDisbaleCheck}>
        <div
          class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
          onclick={toggleDropdown}
          onkeypress={toggleDropdown}
        >
          <div
            class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
            role="none"
          >
            <div
              role="combobox"
              tabindex="0"
              class="slds-input_faux slds-combobox__input"
              aria-labelledby="combobox-value-id-101"
              id="combobox-id-58-selected-value"
              aria-controls="listbox-id-28"
              aria-expanded="false"
              aria-haspopup="listbox"
            >
              <span class="slds-truncate" id="combobox-value-id-101"
                >{selectedLabel}</span
              >
            </div>
            <span
              class="slds-icon_container slds-icon-utility-switch slds-input__icon slds-input__icon_right"
            >
              <svg
                class="slds-icon slds-icon slds-icon_x-small slds-icon-text-default"
                aria-hidden="true"
              >
                <use
                  xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#switch"
                ></use>
              </svg>
            </span>
          </div>
          <div class="slds-error-section">
            <div
              class="slds-form-element__help"
              data-help-text=""
              aria-live="assertive"
            >
              Complete this field.
            </div>
          </div>
          <div class="search-section">
            <lightning-input
              value={searchString}
              type="search"
              variant="label-hidden"
              name="type-ahead"
              class="search-box"
              onkeyup={filterResults}
              placeholder={searchPlaceholder}
            >
            </lightning-input>
          </div>
          <div
            id="listbox-id-28"
            class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid shipToDropdown"
            role="listbox"
            tabindex="0"
            aria-busy="false"
          >
            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
              <template for:each={options} for:item="option">
                <li role="presentation" key={option.value}>
                  <div
                    aria-selected={option.isSelected}
                    role="option"
                    data-value={option.value}
                    class={option.class}
                    onclick={handleOptionSelect}
                    onkeypress={handleOptionSelect}
                  >
                    <template if:true={option.isSelected}>
                      <lightning-icon
                        class="slds-var-m-top_xx-small slds-var-m-right_medium"
                        icon-name="utility:check"
                        size="x-small"
                        alternative-text="icon"
                      ></lightning-icon>
                      <lightning-formatted-rich-text
                        value={option.label}
                      ></lightning-formatted-rich-text>
                    </template>
                    <template if:false={option.isSelected}>
                      <lightning-formatted-rich-text
                        class="slds-var-m-left_x-large"
                        value={option.label}
                      ></lightning-formatted-rich-text>
                    </template>
                  </div>
                </li>
              </template>
              <!-- <li role="presentation">
                <div role="option" class={optionItemClass}>
                  <slot name="actionbutton"></slot>
                </div>
              </li> -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
