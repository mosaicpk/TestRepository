<template>
    <div class="carousel-wrapper">
        <div class="carousel-track" style={trackStyle}>
            <template for:each={visibleSlides} for:item="slide">
                <div class="carousel-slide" key={slide.slideIndex}>
                    <img src={slide.image} alt={slide.altText} />
                    <div class="slide-header">{slide.header}</div>
                    <div class="slide-description">{slide.description}</div>
                </div>
            </template>
        </div>
        <button class="nav-button prev" onclick={previousSlide}>&#10094;</button>
        <button class="nav-button next" onclick={nextSlide}>&#10095;</button>
    </div>
</template>
