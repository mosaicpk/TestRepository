<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="standard:case" alternative-text="Product Request"
            size="small"></lightning-icon>
            &nbsp; {label.PAGE_TITLE}
        </h3>
        <template for:each={itemList} for:item="item" for:index="index">
            <lightning-record-edit-form key={item.id} object-api-name="PMC_SS_ProductRequest__c">
                <lightning-messages> </lightning-messages>
                <lightning-layout multiple-rows>
                    <lightning-layout-item flexibility="auto" padding="around-small">
                        <lightning-input-field field-name="PMC_SS_Product__c" variant="label-stacked"
                        required>
                        </lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" padding="around-small">
                        <lightning-input-field field-name="PMC_SS_Blend__c" variant="label-stacked"
                        required>
                        </lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" padding="around-small" style="display: none">
                        <lightning-input-field field-name="PMC_SS_Case__c" variant="label-stacked" value={recordId}
                        required>
                        </lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" padding="around-small">
                        <div class="slds-var-p-top_medium">
                            <lightning-icon icon-name="action:new" access-key={item.id} id={index}
                                 alternative-text="Add Row" size="small" title="Add New Row"
                                 onclick={addRow}>
                            </lightning-icon>
                            <lightning-icon icon-name="action:delete" access-key={item.id} id={index}
                             alternative-text="Delete Row" size="small" title="Delete Row"
                            onclick={deleteRow}>
                            </lightning-icon>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>

            </lightning-record-edit-form>
        </template>
        </br>
        <lightning-layout>
            <div class="slds-align_absolute-center">
                <lightning-button variant="success" onclick={handleSubmit} name="Submit"
                label="Submit">
                </lightning-button>
            </div>
        </lightning-layout>
    </lightning-card>
</template>
