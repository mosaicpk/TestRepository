<template>
    <div class="slds-align_absolute-center">
        <ul class="slds-grid slds-gutters slds-size_1-of-1">
            <li class="slds-col" for:each={stepsData} for:item="item" key={item}>
                <div class="step-icon">
                    <c-rc_steps-tracker-icons icon={item.icon} status={item.status}>
                    </c-rc_steps-tracker-icons>
                </div>
                <div class="title slds-align_absolute-center" data-status={item.status}>{item.title}</div>
                <div class="status-icon">
                    <c-rc_steps-tracker-icons status-icon=true status={item.status}>
                    </c-rc_steps-tracker-icons>
                </div>
                <hr class="border">
            </li>
        </ul>
    </div>
    <br/><br/>
    <div class="controls">
        <lightning-button label="Previous" onclick={previousHandler}></lightning-button> &nbsp;
        <lightning-button label="Next" variant="brand" onclick={nextHandler}></lightning-button>
    </div>
    <br/><br/>
    <br/><br/>
    <br/><br/>

    <lightning-map
        map-markers={mapMarkers}
        onmarkerselect={handleMarkerSelect}
        selected-marker-value={selectedMarkerValue}
        zoom-level={zoomLevel}
        list-view={listView}
    >
    </lightning-map>
</template>
