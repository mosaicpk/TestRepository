<template>
  <div class="search-container">
    <lightning-input type="text" class="search" placeholder="Search" value={searchTerm}
      onkeydown={handleSearchTermKeyDown} onchange={search}></lightning-input>
    <lightning-button-icon icon-name="utility:search" variant="bare" alternative-text="Search" title="Search"
      onclick={handleSearchChange}></lightning-button-icon>
    <div class="search-dropdown" if:true={_isSearchFlyout}>
      <div class="search-dropdown-box">
        <ul class="search-dropdown__list">
          <p class="product-suggestions-text">Product Suggestions</p>
          <template for:each={_searchResults} for:item="item">
            <li class="search-dropdown__item" data-product-val={item.strProductValue} key={item.id}
              onclick={handleSearchFlyoutChange} tabindex="0" onkeydown={searchFlyoutKeypressHandler}>
              <lightning-formatted-rich-text value={item.strProductValue}></lightning-formatted-rich-text>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </div>
</template>
